name: docker-executor-monitor
on:
  push:
    branches:
      - 'main'
      - 'develop'
    tags:
      - '*'
  workflow_dispatch:
jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Collect metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/etl-executor-monitor
          tags: |
            # On main branch push use date with sha.
            type=raw,value={{date 'YYYY-MM-DD'}}-{{sha}},enable=${{ github.ref_name == 'main' }}
            # On develop branch push with latest tag.
            type=raw,value=latest,enable=${{ github.ref_name == 'develop' }}
      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: ./
          file: ./executor-monitor/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
